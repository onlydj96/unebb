name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (format, analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # .fvmrc is the single source of the pinned Flutter version.
      - name: Read pinned Flutter version
        id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Before codegen, so only committed sources are checked.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  edge-functions:
    name: Edge Functions (check, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check
        run: >-
          deno check
          supabase/functions/*/index.ts
          supabase/functions/_shared/*.ts
          supabase/functions/*/*_test.ts

      - name: Lint
        run: deno lint supabase/functions

      - name: Test
        run: deno test --allow-env supabase/functions
